<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GTA 6 Clip Studio — Настройки</title>
<link rel="stylesheet" href="settings.css">
<script src="settings.js" defer></script></head>
<body>
<header><h1>Настройки приложения</h1><p>Токены шифруются средствами Windows. После сохранения перезапусти приложение, чтобы настройки использовались сервером.</p></header>
<main>
<section><h2>Безопасность</h2><p id="vault-status">Проверка хранилища…</p><div id="secrets"></div></section>
<section><h2>Обновления</h2><p id="update-status">Проверка…</p><button id="check-update">Проверить обновления</button><p class="hint">Релизы поступают из GitHub. Перед установкой завершай активный рендер.</p></section>
<p id="notice" role="status"></p>
</main></body></html>
