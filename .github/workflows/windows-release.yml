name: Publish Windows desktop update
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in desktop/package.json, e.g. 0.2.0'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require public repository for token-free update downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $isPrivate = gh api "repos/$env:GITHUB_REPOSITORY" --jq '.private'
          if ($isPrivate -ne 'false') { throw 'STOP: repository is still private. Change visibility to Public before creating a token-free GitHub Release.' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require matching app version
        shell: pwsh
        run: |
          $v = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($v -ne '${{ inputs.version }}') { throw "Manual release version doesn't match desktop/package.json" }
          } elseif ("v$v" -ne $env:GITHUB_REF_NAME) {
            throw "Git tag and desktop/package.json version differ"
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage portable Python FFmpeg Deno and media dependencies
        shell: pwsh
        run: ./desktop/scripts/stage-windows.ps1
      - name: Block incomplete release builds
        shell: pwsh
        run: |
          if (-not (Test-Path 'desktop/runtime/python/python.exe')) { throw 'Portable Python runtime not packaged yet. Do not publish an incomplete installer.' }
          if (-not (Test-Path 'desktop/runtime/ffmpeg/ffmpeg.exe')) { throw 'FFmpeg not packaged yet. Do not publish an incomplete installer.' }
      - name: Check for accidentally embedded credentials
        shell: pwsh
        run: |
          $matches = Get-ChildItem -Path desktop,webjs,core,config -Recurse -File -Include *.js,*.py,*.json | Select-String -Pattern 'sk-[a-zA-Z0-9_-]{16,}|ghp_[A-Za-z0-9]{20,}' -Quiet
          if ($matches) { throw 'Possible hard-coded credential in source; release blocked.' }
      - name: Check syntax
        shell: pwsh
        run: |
          foreach ($f in @('main.js','preload.js','vault.js','updater.js','settings.js')) {
            node --check "desktop/$f"
            if ($LASTEXITCODE -ne 0) { throw "Syntax error in $f" }
          }
      - name: Smoke test Windows Python FFmpeg Deno and health endpoints
        shell: pwsh
        run: ./desktop/scripts/smoke-windows.ps1
      - name: Install desktop build tools
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build and publish NSIS installer + latest.yml to GitHub Releases
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always
