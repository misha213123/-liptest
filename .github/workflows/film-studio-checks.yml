name: Film Studio syntax checks
on:
  push:
    branches: [feature/movie-series-studio]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m py_compile webjs/film_catalog.py webjs/film_catalog_api.py webjs/film_render.py webjs/film_video2x.py
      - name: Node syntax
        run: node --check webjs/server.js
      - name: Film Studio offline unit tests
        run: python -m unittest discover -s tests -p test_film_studio.py -v

  powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Video2X installer with Windows PowerShell 5.1
        shell: powershell
        run: |
          $scriptPath = 'scripts/install-video2x.ps1'
          $raw = [System.IO.File]::ReadAllBytes((Resolve-Path $scriptPath).Path)
          if (@($raw | Where-Object { $_ -gt 127 }).Count -ne 0) {
            throw 'The installer must be ASCII for Windows PowerShell 5.1 compatibility.'
          }
          $tokens = $null
          $errorsFound = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $scriptPath).Path,
              [ref]$tokens,
              [ref]$errorsFound
          ) | Out-Null
          if ($null -ne $errorsFound -and $errorsFound.Count -gt 0) {
            $errorsFound | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'Windows PowerShell 5.1 syntax: OK'
