name: Film Studio syntax checks
on:
  push:
    branches: [feature/movie-series-studio]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m py_compile webjs/film_catalog.py webjs/film_catalog_api.py webjs/film_render.py
      - name: Node syntax
        run: node --check webjs/server.js
      - name: Film Studio offline unit tests
        run: python -m unittest discover -s tests -p test_film_studio.py -v
