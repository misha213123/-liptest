name: Film Studio syntax checks
on:
  push:
    branches: [feature/movie-series-studio]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m py_compile webjs/film_catalog.py webjs/film_catalog_api.py webjs/film_render.py webjs/film_video2x.py webjs/film_runtime.py webjs/film_preview.py webjs/film_captions.py webjs/film_filters.py webjs/film_openai.py webjs/film_openai_max.py webjs/film_highlights.py webjs/film_transcript_cache.py webjs/film_ai_detail.py
      - name: Node syntax
        run: |
          node --check webjs/server.js
          node --check webjs/film_downloads.js
      - name: Completed browser Downloads import tests
        run: node --test tests/film_downloads.test.js
      - name: Film Studio offline unit tests
        run: python -m unittest discover -s tests -p test_film_studio.py -v

  powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Video2X and AI Detail installers with Windows PowerShell 5.1
        shell: powershell
        run: |
          $scriptPaths = @(
            'scripts/install-video2x.ps1',
            'scripts/install-ai-detail-restore.ps1'
          )
          foreach ($scriptPath in $scriptPaths) {
            $full = (Resolve-Path $scriptPath).Path
            $raw = [System.IO.File]::ReadAllBytes($full)
            if (@($raw | Where-Object { $_ -gt 127 }).Count -ne 0) {
              throw ('Installer must be ASCII: ' + $scriptPath)
            }
            $tokens = $null
            $errorsFound = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $full,
              [ref]$tokens,
              [ref]$errorsFound
            ) | Out-Null
            if ($null -ne $errorsFound -and $errorsFound.Count -gt 0) {
              $errorsFound | ForEach-Object { Write-Error $_.Message }
              throw ('PowerShell syntax invalid: ' + $scriptPath)
            }
            Write-Host ($scriptPath + ' Windows PowerShell 5.1 syntax OK')
          }
